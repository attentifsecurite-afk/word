<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b579a"/>
      <stop offset="100%" style="stop-color:#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="64" fill="url(#bg)"/>
  <!-- 4 carrés représentant les 4 applications -->
  <rect x="100" y="100" width="140" height="140" rx="20" fill="#2b579a" stroke="white" stroke-width="4"/>
  <rect x="272" y="100" width="140" height="140" rx="20" fill="#217346" stroke="white" stroke-width="4"/>
  <rect x="100" y="272" width="140" height="140" rx="20" fill="#d24726" stroke="white" stroke-width="4"/>
  <rect x="272" y="272" width="140" height="140" rx="20" fill="#0078d4" stroke="white" stroke-width="4"/>
  <!-- Lettres dans chaque carré -->
  <text x="170" y="200" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">W</text>
  <text x="342" y="200" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">X</text>
  <text x="170" y="372" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">P</text>
  <text x="342" y="372" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">O</text>
</svg>
